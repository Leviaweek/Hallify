services:
  db:
    image: postgres:18
    environment:
      'POSTGRES_DB': '${DATABASE}'
      'POSTGRES_PASSWORD': '${PASSWORD}'
      'POSTGRES_USER': '${USERNAME}'
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
  
  hallifyapi:
    image: hallifyapi
    build:
      context: .
      dockerfile: HallifyApi/Dockerfile

volumes:
  pgdata: